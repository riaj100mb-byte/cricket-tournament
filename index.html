<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cricket Tournament</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>🏏 Cricket Tournament</h1>
    <p>Team & Player Registration</p>
  </header>

  <main>

    <!-- TEAM FORM -->
    <section class="card">
      <h2>➕ Add Team</h2>

      <form id="teamForm">

        <input
          type="text"
          id="teamName"
          placeholder="🏏 Team Name"
          required
        >

        <input
          type="text"
          id="captainName"
          placeholder="👑 Captain Name"
          required
        >

        <input
          type="tel"
          id="captainPhone"
          placeholder="📱 Captain Phone Number"
          required
        >

        <button type="submit">
          ➕ Add Team
        </button>

      </form>
    </section>


    <!-- PLAYER FORM -->
    <section class="card">

      <h2>👤 Add Player</h2>

      <form id="playerForm">

        <select id="playerTeam" required>
          <option value="">Select Team</option>
        </select>

        <input
          type="text"
          id="playerName"
          placeholder="Player Name"
          required
        >

        <input
          type="tel"
          id="playerPhone"
          placeholder="Phone Number"
          required
        >

        <input
          type="number"
          id="playerAge"
          placeholder="Age"
          min="1"
          required
        >

        <input
          type="text"
          id="playerVillage"
          placeholder="Village"
          required
        >

        <label>📸 Player Photo</label>

        <input
          type="file"
          id="playerPhoto"
          accept="image/*"
        >

        <button type="submit">
          ➕ Add Player
        </button>

      </form>

    </section>


    <!-- TEAMS -->
    <section class="card">

      <h2>🏆 All Teams</h2>

      <div id="teamsContainer">
        <p>Loading teams...</p>
      </div>

    </section>

  </main>

  <!-- EDIT PLAYER MODAL -->
  <div id="editModal" class="modal">

    <div class="modal-content">

      <span id="closeModal">&times;</span>

      <h2>✏️ Edit Player</h2>

      <form id="editPlayerForm">

        <input type="hidden" id="editPlayerId">

        <input
          type="text"
          id="editPlayerName"
          placeholder="Player Name"
          required
        >

        <input
          type="tel"
          id="editPlayerPhone"
          placeholder="Phone Number"
          required
        >

        <input
          type="number"
          id="editPlayerAge"
          placeholder="Age"
          required
        >

        <input
          type="text"
          id="editPlayerVillage"
          placeholder="Village"
          required
        >

        <input
          type="file"
          id="editPlayerPhoto"
          accept="image/*"
        >

        <button type="submit">
          💾 Save Changes
        </button>

      </form>

    </div>

  </div>


  <script src="app.js"></script>

</body>
</html>
